# v8-runner project manifest
basePath: '/workspaces/work/repos/1c-framework/onec-client-mcp-devkit'
workPath: 'build'
execution_timeout: 300000

format: EDT
builder: DESIGNER

# Серверная dev-база `dev_tech` на onec-infra — пустая инфра-заглушка для прогона
# через Конфигуратор (выдаёт лицензию, не несёт данных).
connection: 'Srvr="onec-infra";Ref="dev_tech"'

source-set:
  - name: wt_mcp_adapter
    type: EXTENSION
    path: 'exts/wt-mcp-adapter'

  - name: test_client
    type: EXTENSION
    path: 'exts/test_client'

  - name: configuration
    type: CONFIGURATION
    path: 'fixtures/configuration'

  - name: tests
    type: EXTENSION
    path: 'tests'

tools:
  platform:
    version: '8.3.27'
  enterprise:
    additional-launch-keys:
      - /TESTMANAGER
  edt-cli:
    interactive-mode: true

build:
  partialLoadThreshold: 20
